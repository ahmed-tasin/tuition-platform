<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অফার পোস্ট করুন — টিউশন প্লাটফর্ম</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <nav class="nav">
    <a class="logo" href="index.html">টিউশন<span>প্লাটফর্ম</span></a>
    <div class="nav-links">
      <a href="index.html">হোম</a>
      <a href="tutors.html">টিউটর খুঁজুন</a>
      <a href="offers.html">টিউশন অফার</a>
      <a href="request.html">টিউটর চাই</a>
      <a href="register.html">টিউটর হিসেবে যোগ দিন</a>
    </div>
  </nav>
</header>

<main class="container">
  <div class="form-card">
    <h1 style="font-size:1.6rem">টিউশনির অফার পোস্ট করুন</h1>
    <p class="lead">আপনার বাসায় পড়ানোর জন্য টিউটর দরকার? ফর্মটি পূরণ করুন — অফারটি টিউশন অফার তালিকায় দেখা যাবে।</p>
    <div class="notice" id="notice" hidden></div>

    <form id="offer-form">
      <div class="field">
        <label for="teacherGender">শিক্ষক *</label>
        <select id="teacherGender" required>
          <option value="male">শুধু পুরুষ (Only Male)</option>
          <option value="female">শুধু মহিলা (Only Female)</option>
          <option value="any">যেকোনো (Any)</option>
        </select>
      </div>
      <div class="field">
        <label for="preferredDepartment">পছন্দের বিভাগ</label>
        <input id="preferredDepartment" placeholder="যেমন: পদার্থবিজ্ঞান, গণিত, ইংরেজি">
      </div>
      <div class="field">
        <label for="location">লোকেশন *</label>
        <input id="location" required placeholder="যেমন: Stadium Gate, ময়মনসিংহ সদর">
      </div>
      <div class="field">
        <label for="class">শ্রেণি *</label>
        <input id="class" required placeholder="যেমন: SSC 27, HSC 26, ৯ম শ্রেণি">
      </div>
      <div class="field">
        <label>বিষয় * (একাধিক বেছে নিতে পারেন)</label>
        <div class="checkbox-group" id="subjects"></div>
      </div>
      <div class="field">
        <label for="studentCount">শিক্ষার্থীর সংখ্যা *</label>
        <input id="studentCount" type="number" min="1" value="1" required>
      </div>
      <div class="field">
        <label for="salary">বেতন (টাকা/মাস) *</label>
        <input id="salary" type="number" min="0" required placeholder="যেমন: 3000">
      </div>
      <div class="field">
        <label for="daysPerWeek">সপ্তাহে কত দিন *</label>
        <select id="daysPerWeek" required>
          <option value="1">১ দিন</option>
          <option value="2">২ দিন</option>
          <option value="3" selected>৩ দিন</option>
          <option value="4">৪ দিন</option>
          <option value="5">৫ দিন</option>
          <option value="6">৬ দিন</option>
          <option value="7">৭ দিন</option>
        </select>
      </div>
      <div class="field">
        <label for="durationPerDay">প্রতিদিন কতক্ষণ *</label>
        <select id="durationPerDay" required>
          <option value="১ ঘণ্টা">১ ঘণ্টা</option>
          <option value="১ ঘণ্টা+" selected>১ ঘণ্টা+</option>
          <option value="১.৫ ঘণ্টা">১.৫ ঘণ্টা</option>
          <option value="২ ঘণ্টা">২ ঘণ্টা</option>
        </select>
      </div>
      <div class="field">
        <label for="mediaFee">মিডিয়া ফি *</label>
        <select id="mediaFee" required>
          <option value="প্রযোজ্য" selected>প্রযোজ্য (Applicable)</option>
          <option value="প্রযোজ্য নয়">প্রযোজ্য নয় (Not applicable)</option>
        </select>
      </div>
      <div class="field">
        <label for="posterName">আপনার নাম</label>
        <input id="posterName" placeholder="যেমন: আরিফের বাবা">
      </div>
      <div class="field">
        <label for="phone">মোবাইল নম্বর</label>
        <input id="phone" type="tel" placeholder="01XXXXXXXXX">
      </div>
      <div class="field">
        <label for="notes">আবেদনের নির্দেশনা / বিশেষ নোট</label>
        <textarea id="notes" rows="3" placeholder="যেমন: ইনবক্সে শর্ট সিভি, অভিজ্ঞতা, স্টুডেন্ট আইডি কার্ড ও নম্বর দিয়ে মেসেজ দিন।"></textarea>
      </div>
      <button class="btn" type="submit" style="width:100%">অফার পোস্ট করুন</button>
    </form>
  </div>
</main>

<footer>টিউশন প্লাটফর্ম — ঢাকা, বাংলাদেশ • <a href="admin.html">অ্যাডমিন</a></footer>

<script src="app.js"></script>
<script>
  document.getElementById("subjects").innerHTML = SUBJECTS.map(
    (s) => `<label><input type="checkbox" name="subjects" value="${s}"> ${s}</label>`
  ).join("");

  const notice = document.getElementById("notice");
  document.getElementById("offer-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const subjects = checkedValues("subjects");
    if (!subjects.length) {
      showNotice(notice, "অন্তত একটি বিষয় নির্বাচন করুন।", "error");
      return;
    }
    const data = {
      teacherGender: document.getElementById("teacherGender").value,
      preferredDepartment: document.getElementById("preferredDepartment").value.trim(),
      location: document.getElementById("location").value.trim(),
      class: document.getElementById("class").value.trim(),
      subjects,
      studentCount: Number(document.getElementById("studentCount").value) || 1,
      salary: Number(document.getElementById("salary").value),
      daysPerWeek: Number(document.getElementById("daysPerWeek").value),
      durationPerDay: document.getElementById("durationPerDay").value,
      mediaFee: document.getElementById("mediaFee").value,
      posterName: document.getElementById("posterName").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      notes: document.getElementById("notes").value.trim()
    };
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    try {
      const saved = await postJson("/offers", data);
      showNotice(notice, `ধন্যবাদ! আপনার অফারটি পোস্ট হয়েছে (অফার নং: ${saved.id})। টিউটররা এখন অফারটি দেখতে পাবেন।`, "success");
      e.target.reset();
      document.getElementById("studentCount").value = 1;
      document.getElementById("daysPerWeek").value = "3";
      document.getElementById("durationPerDay").value = "১ ঘণ্টা+";
      document.getElementById("mediaFee").value = "প্রযোজ্য";
    } catch (err) {
      // সার্ভার না পাওয়া গেলে স্থানীয়ভাবে সংরক্ষণ করুন
      try {
        const local = JSON.parse(localStorage.getItem("tp_local_offers") || "[]");
        const id = 1000 + local.length + 1;
        local.push({ ...data, id, status: "খোলা", createdAt: new Date().toISOString() });
        localStorage.setItem("tp_local_offers", JSON.stringify(local));
        showNotice(notice, "সার্ভারের সাথে সংযোগ হয়নি, তবে আপনার অফারটি এই ডিভাইসে সংরক্ষিত হয়েছে এবং অফার তালিকায় দেখা যাবে।", "info");
        e.target.reset();
        document.getElementById("studentCount").value = 1;
        document.getElementById("daysPerWeek").value = "3";
        document.getElementById("durationPerDay").value = "১ ঘণ্টা+";
        document.getElementById("mediaFee").value = "প্রযোজ্য";
      } catch (e2) {
        showNotice(notice, "অফার পোস্ট করা যায়নি: " + err.message, "error");
      }
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
