<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>টিউটর চাই — টিউশন প্লাটফর্ম</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <nav class="nav">
    <a class="logo" href="index.html">টিউশন<span>প্লাটফর্ম</span></a>
    <div class="nav-links">
      <a href="index.html">হোম</a>
      <a href="tutors.html">টিউটর খুঁজুন</a>
      <a href="offers.html">টিউশন অফার</a>
      <a href="request.html" class="active">টিউটর চাই</a>
      <a href="register.html">টিউটর হিসেবে যোগ দিন</a>
    </div>
  </nav>
</header>

<main class="container">
  <div class="form-card">
    <h1 style="font-size:1.6rem">টিউটরের জন্য অনুরোধ করুন</h1>
    <p class="lead">ফর্মটি পূরণ করুন — আপনার এলাকা ও বাজেটের সাথে মিলিয়ে উপযুক্ত টিউটর খুঁজে দেওয়া হবে।</p>
    <div class="notice" id="notice" hidden></div>

    <form id="request-form">
      <div class="field">
        <label for="studentName">শিক্ষার্থীর নাম *</label>
        <input id="studentName" required placeholder="যেমন: আরিফ হোসেন">
      </div>
      <div class="field">
        <label for="guardianName">অভিভাবকের নাম</label>
        <input id="guardianName" placeholder="যেমন: করিম হোসেন">
      </div>
      <div class="field">
        <label for="phone">মোবাইল নম্বর *</label>
        <input id="phone" type="tel" required placeholder="01XXXXXXXXX">
      </div>
      <div class="field">
        <label for="class">শ্রেণি *</label>
        <select id="class" required></select>
      </div>
      <div class="field">
        <label>বিষয় * (একাধিক বেছে নিতে পারেন)</label>
        <div class="checkbox-group" id="subjects"></div>
      </div>
      <div class="field">
        <label for="area">এলাকা *</label>
        <select id="area" required></select>
      </div>
      <div class="field">
        <label for="budget">মাসিক বাজেট (টাকা)</label>
        <input id="budget" type="number" min="0" placeholder="যেমন: 5000">
      </div>
      <div class="field">
        <label for="preferredTime">পছন্দের সময়</label>
        <select id="preferredTime">
          <option value="">নির্বাচন করুন</option>
          <option>সকাল (৭টা–১০টা)</option>
          <option>দুপুর (১২টা–৩টা)</option>
          <option>বিকাল (৪টা–৬টা)</option>
          <option>সন্ধ্যা (৬টা–৯টা)</option>
        </select>
      </div>
      <div class="field">
        <label for="notes">বিশেষ কিছু জানাতে চাইলে লিখুন</label>
        <textarea id="notes" rows="3" placeholder="যেমন: সপ্তাহে ৪ দিন, শুধু গণিতের দুর্বল অধ্যায়গুলো"></textarea>
      </div>
      <button class="btn" type="submit" style="width:100%">অনুরোধ পাঠান</button>
    </form>
  </div>
</main>

<footer>টিউশন প্লাটফর্ম — ঢাকা, বাংলাদেশ • <a href="admin.html">অ্যাডমিন</a></footer>

<script src="app.js"></script>
<script>
  fillSelect(document.getElementById("class"), CLASSES, "শ্রেণি নির্বাচন করুন");
  fillSelect(document.getElementById("area"), AREAS, "এলাকা নির্বাচন করুন");
  document.getElementById("subjects").innerHTML = SUBJECTS.map(
    (s) => `<label><input type="checkbox" name="subjects" value="${s}"> ${s}</label>`
  ).join("");

  const notice = document.getElementById("notice");
  document.getElementById("request-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const subjects = checkedValues("subjects");
    if (!subjects.length) {
      showNotice(notice, "অন্তত একটি বিষয় নির্বাচন করুন।", "error");
      return;
    }
    const data = {
      studentName: document.getElementById("studentName").value.trim(),
      guardianName: document.getElementById("guardianName").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      class: document.getElementById("class").value,
      subjects,
      area: document.getElementById("area").value,
      budget: document.getElementById("budget").value ? Number(document.getElementById("budget").value) : null,
      preferredTime: document.getElementById("preferredTime").value,
      notes: document.getElementById("notes").value.trim()
    };
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    try {
      const saved = await postJson("/requests", data);
      showNotice(notice, `ধন্যবাদ! আপনার অনুরোধটি গৃহীত হয়েছে (অনুরোধ নং: ${saved.id})। শীঘ্রই যোগাযোগ করা হবে।`, "success");
      e.target.reset();
    } catch (err) {
      // সার্ভার না পাওয়া গেলে স্থানীয়ভাবে সংরক্ষণ করুন
      try {
        const local = JSON.parse(localStorage.getItem("tp_local_requests") || "[]");
        local.push({ ...data, id: local.length + 1, status: "নতুন", createdAt: new Date().toISOString() });
        localStorage.setItem("tp_local_requests", JSON.stringify(local));
        showNotice(notice, "সার্ভারের সাথে সংযোগ হয়নি, তবে আপনার অনুরোধটি এই ডিভাইসে সংরক্ষিত হয়েছে।", "info");
        e.target.reset();
      } catch (e2) {
        showNotice(notice, "অনুরোধ পাঠানো যায়নি: " + err.message, "error");
      }
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
