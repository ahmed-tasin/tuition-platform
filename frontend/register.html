<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>টিউটর হিসেবে যোগ দিন — টিউশন প্লাটফর্ম</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <nav class="nav">
    <a class="logo" href="index.html">টিউশন<span>প্লাটফর্ম</span></a>
    <div class="nav-links">
      <a href="index.html">হোম</a>
      <a href="tutors.html">টিউটর খুঁজুন</a>
      <a href="offers.html">টিউশন অফার</a>
      <a href="request.html">টিউটর চাই</a>
      <a href="register.html" class="active">টিউটর হিসেবে যোগ দিন</a>
    </div>
  </nav>
</header>

<main class="container">
  <div class="form-card">
    <h1 style="font-size:1.6rem">টিউটর হিসেবে নিবন্ধন করুন</h1>
    <p class="lead">আপনার তথ্য দিন — যাচাই শেষে আপনার প্রোফাইল টিউটর তালিকায় দেখা যাবে।</p>
    <div class="notice" id="notice" hidden></div>

    <form id="register-form">
      <div class="field">
        <label for="name">আপনার নাম *</label>
        <input id="name" required placeholder="যেমন: তানভীর হাসান">
      </div>
      <div class="field">
        <label for="phone">মোবাইল নম্বর *</label>
        <input id="phone" type="tel" required placeholder="01XXXXXXXXX">
      </div>
      <div class="field">
        <label for="university">বিশ্ববিদ্যালয় / প্রতিষ্ঠান *</label>
        <input id="university" required placeholder="যেমন: বুয়েট / ঢাকা বিশ্ববিদ্যালয়">
      </div>
      <div class="field">
        <label for="department">বিভাগ</label>
        <input id="department" placeholder="যেমন: কম্পিউটার সায়েন্স অ্যান্ড ইঞ্জিনিয়ারিং">
      </div>
      <div class="field">
        <label>যেসব বিষয় পড়ান * (একাধিক বেছে নিতে পারেন)</label>
        <div class="checkbox-group" id="subjects"></div>
      </div>
      <div class="field">
        <label>যেসব শ্রেণি পড়ান * (একাধিক বেছে নিতে পারেন)</label>
        <div class="checkbox-group" id="classes"></div>
      </div>
      <div class="field">
        <label>যেসব এলাকায় পড়াতে পারবেন * (একাধিক বেছে নিতে পারেন)</label>
        <div class="checkbox-group" id="areas"></div>
      </div>
      <div class="field">
        <label for="monthlyFee">মাসিক ফি (টাকা) *</label>
        <input id="monthlyFee" type="number" min="0" required placeholder="যেমন: 5000">
      </div>
      <div class="field">
        <label for="experienceYears">পড়ানোর অভিজ্ঞতা (বছর)</label>
        <input id="experienceYears" type="number" min="0" placeholder="যেমন: 3">
      </div>
      <div class="field">
        <label for="about">নিজের সম্পর্কে কিছু লিখুন</label>
        <textarea id="about" rows="3" placeholder="যেমন: গত ৩ বছর ধরে HSC গণিত ও পদার্থবিজ্ঞান পড়াচ্ছি।"></textarea>
      </div>
      <button class="btn" type="submit" style="width:100%">নিবন্ধন করুন</button>
    </form>
  </div>
</main>

<footer>টিউশন প্লাটফর্ম — ঢাকা, বাংলাদেশ • <a href="admin.html">অ্যাডমিন</a></footer>

<script src="app.js"></script>
<script>
  document.getElementById("subjects").innerHTML = SUBJECTS.map(
    (s) => `<label><input type="checkbox" name="subjects" value="${s}"> ${s}</label>`
  ).join("");
  document.getElementById("classes").innerHTML = CLASSES.map(
    (c) => `<label><input type="checkbox" name="classes" value="${c}"> ${c}</label>`
  ).join("");
  document.getElementById("areas").innerHTML = AREAS.map(
    (a) => `<label><input type="checkbox" name="areas" value="${a}"> ${a}</label>`
  ).join("");

  const notice = document.getElementById("notice");
  document.getElementById("register-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const subjects = checkedValues("subjects");
    const classes = checkedValues("classes");
    const areas = checkedValues("areas");
    if (!subjects.length || !classes.length || !areas.length) {
      showNotice(notice, "বিষয়, শ্রেণি ও এলাকা — প্রতিটি থেকে অন্তত একটি করে নির্বাচন করুন।", "error");
      return;
    }
    const data = {
      name: document.getElementById("name").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      university: document.getElementById("university").value.trim(),
      department: document.getElementById("department").value.trim(),
      subjects,
      classes,
      areas,
      monthlyFee: Number(document.getElementById("monthlyFee").value),
      experienceYears: Number(document.getElementById("experienceYears").value) || 0,
      about: document.getElementById("about").value.trim()
    };
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    try {
      const saved = await postJson("/tutors", data);
      showNotice(notice, `অভিনন্দন! আপনার প্রোফাইল তৈরি হয়েছে। টিউটর তালিকায় আপনার নাম দেখা যাবে।`, "success");
      e.target.reset();
    } catch (err) {
      // সার্ভার না পাওয়া গেলে স্থানীয়ভাবে সংরক্ষণ করুন
      try {
        const local = JSON.parse(localStorage.getItem("tp_local_tutors") || "[]");
        const id = 1000 + local.length + 1;
        local.push({ ...data, id, rating: 5.0, reviewsCount: 0, reviews: [], available: true });
        localStorage.setItem("tp_local_tutors", JSON.stringify(local));
        showNotice(notice, "সার্ভারের সাথে সংযোগ হয়নি, তবে আপনার প্রোফাইলটি এই ডিভাইসে সংরক্ষিত হয়েছে।", "info");
        e.target.reset();
      } catch (e2) {
        showNotice(notice, "নিবন্ধন করা যায়নি: " + err.message, "error");
      }
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
